# Rows the game engine uses by ID without any file referencing them (curated; see ds1rand/graph/hardcoded.py).
#
# Each entry links an `engine/<name>:0` node to every listed row, so they count as used and are never treated as free.
#   param       param name
#   ids         row IDs and/or "first-last" ranges (inclusive; only existing rows are linked)
#   reason      what the engine does with them
#   source      where the claim comes from
#   confidence  "certain" (verified) or "inferred" (documented by the community, not verified in game)
#
# Add entries as rows are identified (docs/AUDIT.md item 14; `tools/build_graph.py --orphans` lists candidates).

